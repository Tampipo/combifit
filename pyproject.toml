[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "combifit"
version = "0.1.0"
description = "A Python package to easily combine multiple fit results from their best fit value and covariance matrix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanguy Marsault", email = "tanguy.marsault02@gmail.com" }]
keywords = ["combination", "BLUE", "nuisance-parameters", "profile-likelihood", "statistics", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
plot = ["matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/combifit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]